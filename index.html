<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
      background: #f4f4f4;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
    }

    main {
      padding: 50px 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Website</h1>
    <p>Welcome to my website</p>
  </header>

  <main>
    <h2>Hello!</h2>
    <p>This is a basic HTML website.</p>
    <button>Click Me</button>
  </main>

</body>
</html>
